<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONDA LABS v0.2 Assembly</title><style>body{margin:0;background:#071e31;color:#f6f0de;font:15px system-ui}header,section{padding:16px;background:#10344a;margin:12px;border-radius:15px}h1{font-size:23px}label{display:flex;justify-content:space-between;margin:12px 0}input{width:100px;background:#08283a;color:white;border:1px solid #50788a;border-radius:7px;padding:8px}button{background:#f5ca54;color:#132d3b;border:0;border-radius:9px;padding:12px;margin:5px;font-weight:bold}canvas{width:100%;background:linear-gradient(#174963,#08253a);border-radius:12px;touch-action:none}small{color:#c2d0d5}</style><header><h1>🌊 ONDA Engineering Studio</h1>Mission 001.2 • Parametric Assembly • Prototype</header><section><h3>Dimensions (mm)</h3><label>Tray width<input id="w" type="number" value="300"></label><label>Tray depth<input id="d" type="number" value="250"></label><label>Base thickness<input id="t" type="number" value="4"></label><label>Rim height<input id="h" type="number" value="18"></label><label>Rim thickness<input id="wall" type="number" value="3"></label><label>Cup diameter<input id="cup" type="number" value="80"></label><label>Gap<input id="gap" type="number" value="8"></label><button onclick="render()">Update model</button><button onclick="exploded=!exploded;render()">Explode / Assemble</button></section><section><h3>Assembly preview</h3><canvas id="view" width="700" height="540"></canvas><p id="report"></p><button onclick="exportParts()">Export component STLs</button><button onclick="exportParams()">Export parameters JSON</button><p><small>Drag to rotate. Visualization and STL are geometric prototypes, not manufacturing validation. Cups are reference outlines, not physical cavities.</small></p></section><script>
const keys=['w','d','t','h','wall','cup','gap'];let angle=.65,exploded=false;const cv=document.getElementById('view'),ctx=cv.getContext('2d');function params(){return Object.fromEntries(keys.map(k=>[k,+document.getElementById(k).value]))}
function parts(p){let {w,d,t,h,wall}=p;return [{name:'base',x:0,y:0,z:0,w,d,h:t},{name:'rim_front',x:0,y:0,z:t,w,d:wall,h},{name:'rim_back',x:0,y:d-wall,z:t,w,d:wall,h},{name:'rim_left',x:0,y:wall,z:t,w:wall,d:d-2*wall,h},{name:'rim_right',x:w-wall,y:wall,z:t,w:wall,d:d-2*wall,h}]}
function project(x,y,z){let a=angle,xx=x*Math.cos(a)-y*Math.sin(a),yy=x*Math.sin(a)+y*Math.cos(a);return [350+xx*.85,285+yy*.36-z*1.2]}
function face(vertices,color){ctx.beginPath();vertices.forEach((v,i)=>{let q=project(...v);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#f6ce63';ctx.lineWidth=1.5;ctx.stroke()}
function box(b,i){let {x,y,z,w,d,h}=b;z+=exploded?i*23:0;face([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],i?'#4f9b9b':'#1593a7');face([[x,y+d,z],[x+w,y+d,z],[x+w,y+d,z+h],[x,y+d,z+h]],'#0b637c');face([[x+w,y,z],[x+w,y+d,z],[x+w,y+d,z+h],[x+w,y,z+h]],'#0a5269')}
function render(){let p=params(),ok=keys.every(k=>Number.isFinite(p[k])&&p[k]>0)&&p.wall*2<Math.min(p.w,p.d)&&p.t+p.h<100;ctx.clearRect(0,0,700,540);if(!ok){document.getElementById('report').textContent='Invalid dimensions: all values must be positive, and walls must fit.';return}let ps=parts(p);ps.forEach(box);let usableW=p.w-2*p.wall,usableD=p.d-2*p.wall,cols=Math.floor((usableW+p.gap)/(p.cup+p.gap)),rows=Math.floor((usableD+p.gap)/(p.cup+p.gap));document.getElementById('report').textContent='Assembly: '+ps.length+' components | Estimated cup layout: '+Math.max(0,cols)+' × '+Math.max(0,rows)+' | '+p.w+' × '+p.d+' mm. '+(p.w>220||p.d>220?'WARNING: exceeds 220 × 220 mm reference print bed.':'Fits reference print bed in XY.') }
let start=null;cv.addEventListener('pointerdown',e=>{start=e.clientX;cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(start!==null){angle+=(e.clientX-start)*.008;start=e.clientX;render()}});cv.addEventListener('pointerup',()=>start=null);
function triangles(b){let {x,y,z,w,d,h}=b,V=[[x,y,z],[x+w,y,z],[x+w,y+d,z],[x,y+d,z],[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]],faces=[[0,2,1],[0,3,2],[4,5,6],[4,6,7],[0,1,5],[0,5,4],[1,2,6],[1,6,5],[2,3,7],[2,7,6],[3,0,4],[3,4,7]];return faces.map(f=>'facet normal 0 0 0\n outer loop\n'+f.map(i=>'vertex '+V[i].join(' ')).join('\n')+'\n endloop\nendfacet').join('\n')}
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportParts(){let p=params();if(keys.some(k=>!(p[k]>0))||p.wall*2>=Math.min(p.w,p.d))return alert('Fix dimensions first');parts(p).forEach(b=>download('onda-'+b.name+'.stl','solid '+b.name+'\n'+triangles(b)+'\nendsolid '+b.name,'model/stl'))}
function exportParams(){download('onda-assembly-v02.json',JSON.stringify({version:'0.2',units:'mm',parameters:params(),notes:'prototype geometry; not fabrication approved'},null,2),'application/json')}
render();</script></html>
