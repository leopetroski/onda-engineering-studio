<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONDA Kitchen v0.2</title><style>:root{font-family:system-ui;color:#edf4f5;background:#061e2d}*{box-sizing:border-box}body{margin:0 auto;max-width:1100px}header{background:#0b344a;padding:20px;border-bottom:3px solid #f0c856}h1{margin:4px 0;font-size:24px}main{padding:12px}section,.card{background:#10364a;border:1px solid #2b5870;border-radius:14px;padding:16px;margin:10px 0}button{border:0;border-radius:8px;padding:11px;background:#f0c856;color:#102c39;font-weight:700;margin:3px;cursor:pointer}button.alt{background:#285b70;color:#f1f6f6}button.active{outline:2px solid white}input,textarea,select{background:#08293a;border:1px solid #50768a;border-radius:8px;padding:10px;color:white;width:100%;margin:6px 0 12px}label{display:block}a{color:#ffdb7d}.muted{color:#b2c7d0}.tabs{display:flex;gap:5px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}iframe{width:100%;height:690px;border:1px solid #49768a;border-radius:10px;background:white}.line{border-bottom:1px solid #386176;padding:10px 0}.pill{font-size:12px;color:#ffda7d}pre{white-space:pre-wrap;overflow-wrap:anywhere}footer{padding:18px;color:#a8bfca}button:focus-visible,a:focus-visible{outline:3px solid white}</style></head><body><header><small>🌊 ONDA LABS / AI ENGINEERING KITCHEN</small><h1>Engineering Workspace v0.2</h1><div class="muted">Project → CAD → Calculate → Verify → Evidence</div></header><main><section><h2>Project registry</h2><div id="projects" class="grid"></div><label>New project<input id="newProject" placeholder="Project name" maxlength="80"></label><button id="create">Create local project</button><button class="alt" id="import">Import project JSON</button><input id="file" type="file" accept=".json,application/json" hidden><p class="muted">Local browser storage only. Export a JSON backup before changing devices.</p></section><section id="workspace"><h2 id="title"></h2><div id="tabs" class="tabs"></div><div id="panel"></div></section></main><footer>R&D only • No manufacturing approval • No production systems connected</footer><script>
const seed={schemaVersion:'0.2',id:'onda-fridge-001',name:'ONDA FRIDGE 001',status:'Prototype',objective:'Design a modular dessert support and verify physical constraints.',requirements:[{text:'Measure internal usable width, depth and height',done:false},{text:'Measure actual cup dimensions',done:false},{text:'Check material and food-contact suitability',done:false}],links:[{label:'ONDA FRIDGE repository',url:'https://github.com/leopetroski/ONDA-FRIDGE-001'}],checks:[{name:'Dimensional fit',status:'Pending'},{name:'Structural testing',status:'Not tested'},{name:'Manufacturing review',status:'Not tested'}],evidence:[],revisions:[{date:'2026-11-23',note:'Initial project seeded from existing engineering context.'}]};
const key='onda-kitchen-v02-projects';let projects;try{let a=JSON.parse(localStorage.getItem(key));projects=Array.isArray(a)?a:[structuredClone(seed)]}catch{projects=[structuredClone(seed)]}let current=projects[0]?.id,tab='Overview';const $=id=>document.getElementById(id);function el(t,text,cls){let n=document.createElement(t);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function btn(t,fn,cls='alt'){let b=el('button',t,cls);b.onclick=fn;return b}function save(){localStorage.setItem(key,JSON.stringify(projects))}function project(){return projects.find(p=>p.id===current)}function download(name,text){let u=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function render(){let box=$('projects');box.replaceChildren();projects.forEach(p=>{let c=el('div',undefined,'card');c.append(el('h3',p.name),el('p',p.status,'pill'),btn('Open',()=>{current=p.id;tab='Overview';render()}));box.append(c)});let p=project();$('workspace').hidden=!p;if(!p)return;$('title').textContent=p.name;let tabs=$('tabs');tabs.replaceChildren();['Overview','CAD Viewer','Engineer Tools','Requirements','Evidence','Revisions'].forEach(t=>tabs.append(btn(t,()=>{tab=t;render()},tab===t?'active':'alt')));let panel=$('panel');panel.replaceChildren();if(tab==='Overview'){panel.append(el('h3','Objective'),el('p',p.objective),el('p','Stage: '+p.status));let s=el('select');['Concept','Prototype','Design review','Validated'].forEach(v=>{let o=el('option',v);o.value=v;s.append(o)});s.value=p.status;s.onchange=()=>{p.status=s.value;save();render()};panel.append(s,el('p','Stage labels are manual and do not establish technical validation.','muted'))}
if(tab==='CAD Viewer'){panel.append(el('h3','Integrated parametric CAD preview'),el('p','The CAD prototype is embedded from the separate ONDA Engineering Studio. Exported STL files are not automatically imported into Kitchen.','muted'));let frame=el('iframe');frame.title='ONDA parametric CAD prototype';frame.src='https://leopetroski.github.io/onda-engineering-studio/';frame.loading='lazy';panel.append(frame);let a=el('a','Open CAD in full screen');a.href=frame.src;a.target='_blank';a.rel='noopener noreferrer';panel.append(a)}
if(tab==='Engineer Tools'){panel.append(el('h3','Deterministic engineering calculator'),el('p','Calculate whether a rectangular part fits a print bed in XY, including a user-defined clearance. This is not a structural or manufacturing validation.','muted'));let names=[['width','Part width (mm)','300'],['depth','Part depth (mm)','250'],['bedW','Bed width (mm)','220'],['bedD','Bed depth (mm)','220'],['clearance','Clearance per side (mm)','5']];let inputs={};names.forEach(([id,label,value])=>{let l=el('label',label),i=el('input');i.type='number';i.min='0';i.step='any';i.value=value;l.append(i);panel.append(l);inputs[id]=i});let result=el('pre','Awaiting calculation');panel.append(btn('Run verification',()=>{let x=Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,Number(v.value)]));if(Object.values(x).some(v=>!Number.isFinite(v))||x.width<=0||x.depth<=0||x.bedW<=0||x.bedD<=0||x.clearance<0){result.textContent='INVALID INPUT';return}let w=x.bedW-2*x.clearance,d=x.bedD-2*x.clearance;let normal=x.width<=w&&x.depth<=d,rotated=x.depth<=w&&x.width<=d,pass=normal||rotated;let output={tool:'xy_print_bed_fit_v0.2',inputs:x,usableBed:{width:w,depth:d},fitsXY:pass,orientation:normal?'0 degrees':rotated?'90 degrees':'none',limitations:['No Z check','No overhang or tolerance analysis','No load or food safety validation']};result.textContent=JSON.stringify(output,null,2);p.evidence.unshift({date:new Date().toISOString(),kind:'calculation',result:output});save();}),result)}
if(tab==='Requirements'){panel.append(el('h3','Requirements'));p.requirements.forEach(r=>{let row=el('div',undefined,'line'),c=el('input');c.type='checkbox';c.style.width='auto';c.checked=r.done;c.onchange=()=>{r.done=c.checked;save();render()};row.append(c,el('span',' '+r.text));panel.append(row)});let i=el('input');i.placeholder='New requirement';panel.append(i,btn('Add requirement',()=>{let v=i.value.trim();if(!v)return;p.requirements.push({text:v,done:false});save();render()}))}
if(tab==='Evidence'){panel.append(el('h3','Evidence & verification'));p.checks.forEach(c=>panel.append(el('div',c.name+' • '+c.status,'line')));panel.append(el('p','Tool outputs are recorded as evidence, but do not automatically approve a design.','muted'));p.evidence.forEach(e=>{let pre=el('pre',JSON.stringify(e,null,2),'line');panel.append(pre)})}
if(tab==='Revisions'){panel.append(el('h3','Revision history'));p.revisions.forEach(r=>panel.append(el('div',r.date+' • '+r.note,'line')));let i=el('textarea');i.rows=3;i.placeholder='What changed and why?';panel.append(i,btn('Record revision',()=>{let v=i.value.trim();if(!v)return;p.revisions.unshift({date:new Date().toISOString(),note:v});save();render()}),btn('Export project JSON',()=>download(p.id+'.json',JSON.stringify(p,null,2))))}}
$('create').onclick=()=>{let name=$('newProject').value.trim();if(!name)return;let p=structuredClone(seed);p.id='project-'+Date.now();p.name=name;p.status='Concept';p.objective='Define project requirements.';p.requirements=[];p.evidence=[];p.revisions=[];p.links=[];projects.push(p);current=p.id;$('newProject').value='';save();render()};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let p=JSON.parse(await file.text());if(!p||p.schemaVersion!=='0.2'||typeof p.name!=='string'||!Array.isArray(p.requirements)||!Array.isArray(p.evidence)||!Array.isArray(p.revisions)||!Array.isArray(p.checks))throw Error('Unsupported project schema');p.id='import-'+Date.now();projects.push(p);current=p.id;save();render()}catch(err){alert('Import rejected: '+err.message)}e.target.value=''};render();
</script></body></html>
